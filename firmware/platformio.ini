[platformio]
default_envs = octopus_pro_f446
src_dir = src
include_dir = include

; ==============================================================================
; 1. STANDART ORTAM: BTT 32KiB Bootloader Destekli (MicroSD Kart veya DFU ile)
; Octopus Pro V1.0.1 fabrikasyon bootloader'ı ile %100 uyumludur.
; SD karta firmware.bin atıldığında bu ortam derlemesi kullanılır.
; ==============================================================================
[env:octopus_pro_f446]
platform = ststm32
board = genericSTM32F446ZE
framework = arduino
board_build.mcu = stm32f446zet6
board_build.f_cpu = 180000000L
board_build.offset = 0x8000
board_upload.offset_address = 0x08008000

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_USE_CDC
    -D USB_MANUFACTURER=\"LaserRunner\"
    -D USB_PRODUCT=\"LaserRunner_Octopus_Pro\"
    -D HAL_PCD_MODULE_ENABLED
    -D VECT_TAB_OFFSET=0x8000
    -O3
    -Wall

upload_protocol = dfu
upload_flags =
    -a 0
    --dfuse-address
    0x08008000:leave
monitor_speed = 115200

; ==============================================================================
; 2. DOĞRUDAN DFU ORTAMI: Bootloader Olmadan (Adres 0x08000000)
; ==============================================================================
[env:octopus_pro_f446_nobootloader]
platform = ststm32
board = genericSTM32F446ZE
framework = arduino
board_build.mcu = stm32f446zet6
board_build.f_cpu = 180000000L

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_USE_CDC
    -D USB_MANUFACTURER=\"LaserRunner\"
    -D USB_PRODUCT=\"LaserRunner_Octopus_Pro\"
    -D HAL_PCD_MODULE_ENABLED
    -O3
    -Wall

upload_protocol = dfu
upload_flags =
    -a 0
    --dfuse-address
    0x08000000:leave
monitor_speed = 115200
