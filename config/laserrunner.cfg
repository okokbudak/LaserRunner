# ==============================================================================
#  LaserRunner OS - Ana Makine ve TMC Sürücü Yapılandırma Dosyası (laserrunner.cfg)
#  Klipper Tarzı Modüler Yapılandırma Formatı
# ==============================================================================

[machine]
kinematics: cartesian          ; cartesian | corexy | awd_corexy
max_velocity: 300              ; mm/s
max_acceleration: 3000         ; mm/s²
corner_velocity: 15            ; mm/s (Köşe dönüm hızı)

# ------------------------------------------------------------------------------
# REZONANS TELAFI (INPUT SHAPING / RESONANCE COMPENSATION)
# ------------------------------------------------------------------------------
[input_shaper]
enabled: True
shaper_type_x: mzv             ; zv | zvd | mzv | ei | 2hump_ei (CoreXY gantry rezonansını yok eder)
shaper_freq_x: 54.2            ; Hz (X ekseni doğal rezonans frekansı)
damping_ratio_x: 0.1           ; X sönüm oranı (Standart: 0.1)
shaper_type_y: mzv
shaper_freq_y: 48.6            ; Hz (Y ekseni doğal rezonans frekansı)
damping_ratio_y: 0.1

# ------------------------------------------------------------------------------
# ÖZEL HOMING SIRALAMASI ([homing_override])
# ------------------------------------------------------------------------------
[homing_override]
axes: xyz
gcode:
    SET_AIR_ASSIST ACTIVE=0
    G28 Y                      ; Önce Dual-Y Auto-Squaring ile köprüyü hizala
    G28 X                      ; Sonra X eksenini sıfırla

# ------------------------------------------------------------------------------
# LAZER VE PWM YAPILANDIRMASI
# ------------------------------------------------------------------------------
[laser]
pwm_pin: PB0                   ; Octopus Pro BLTouch Servo Çıkışı (TIM3_CH3)
frequency: 5000                ; Hz (Diyot lazerler için 1 kHz - 10 kHz)
max_power_raw: 4095            ; 12-bit donanımsal çözünürlük
dynamic_power: true            ; Hızla orantılı dinamik güç P(v)
min_power_ratio: 0.05          ; İvmelenme başlangıcında taban güç oranı (%5)

# ------------------------------------------------------------------------------
# EKSEN 1: STEPPER X & TMC2209
# ------------------------------------------------------------------------------
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: PF14
rotation_distance: 40          ; GT2 Kayış 20 Diş Kasnak (20 * 2mm = 40mm)
full_steps_per_rotation: 200   ; 1.8° step motor (0.9° motor için 400 yazın)
microsteps: 16
homing_mode: sensorless        ; sensorless | mechanical
homing_speed: 40.0             ; Sensörsüz homing için 40 mm/s Back-EMF stabilitesi
homing_current: 0.500          ; Amper RMS
endstop_pin: PG6

[tmc2209 stepper_x]
uart_pin: PC4
mode: spreadcycle              ; spreadcycle | stealthchop | hybrid (Lazer ivmelerinde SpreadCycle torku şarttır)
run_current: 0.800             ; Amper RMS (800 mA)
hold_current: 0.400            ; Amper RMS (400 mA)
microsteps: 16
interpolate: True              ; 256 mikro-adım enterpolasyonu
stealthchop_threshold: 0       ; 0 = SpreadCycle, 999999 = StealthChop, >0 = Hibrit geçiş hızı
diag_pin: PG6
driver_SGTHRS: 65              ; Sensörsüz Homing Hassasiyeti (0-255)
sense_resistor: 0.110

# ------------------------------------------------------------------------------
# EKSEN 2: STEPPER Y (BİRİNCİL Y / SOL) & TMC2209
# ------------------------------------------------------------------------------
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: PF15
rotation_distance: 40
full_steps_per_rotation: 200
microsteps: 16
homing_mode: sensorless        ; sensorless | mechanical
homing_speed: 40.0
homing_current: 0.550
endstop_pin: PG9

[tmc2209 stepper_y]
uart_pin: PD11
mode: spreadcycle              ; Lazer satır taramada (raster) adım kaçırmamak için SpreadCycle
run_current: 0.900             ; Amper RMS (900 mA)
hold_current: 0.500            ; Amper RMS (500 mA)
microsteps: 16
interpolate: True
stealthchop_threshold: 0
diag_pin: PG9
driver_SGTHRS: 70
sense_resistor: 0.110

# ------------------------------------------------------------------------------
# EKSEN 3: STEPPER Y1 (İKİNCİL Y / SAĞ / DUAL-Y AUTO-SQUARING) & TMC2209
# ------------------------------------------------------------------------------
[stepper_y1]
step_pin: PF11
dir_pin: PG3
enable_pin: PG5
rotation_distance: 40
full_steps_per_rotation: 200
microsteps: 16
homing_mode: sensorless        ; sensorless | mechanical
homing_speed: 40.0
homing_current: 0.550
endstop_pin: PG10

[tmc2209 stepper_y1]
uart_pin: PC6
mode: spreadcycle
run_current: 0.900
hold_current: 0.500
microsteps: 16
interpolate: True
stealthchop_threshold: 0
diag_pin: PG10
driver_SGTHRS: 70
sense_resistor: 0.110

# ------------------------------------------------------------------------------
# EKSEN 4: STEPPER Z (ODAKLAMA / YATAK YÜKSEKLİĞİ) & TMC2209
# ------------------------------------------------------------------------------
[stepper_z]
step_pin: PG4
dir_pin: PC1
enable_pin: PA0
rotation_distance: 8           ; T8 Vidalı Mil (Hatve: 8mm)
full_steps_per_rotation: 200
microsteps: 16
homing_speed: 10.0
endstop_pin: PG11

[tmc2209 stepper_z]
uart_pin: PC7
mode: stealthchop              ; Z ekseninde düşük hız ve tam sessizlik için StealthChop
run_current: 0.600
hold_current: 0.300
microsteps: 16
interpolate: True
stealthchop_threshold: 999999  ; Daima StealthChop
sense_resistor: 0.110

# ------------------------------------------------------------------------------
# ÇEVRE BİRİMLERİ VE EKLENTİLER (ADDONS)
# ------------------------------------------------------------------------------
[air_assist]
pin: PA8                       ; FAN0 MOSFET
auto_enable: true              ; Kesim başlangıcında otomatik aç
pre_delay: 0.5                 ; Lazer ateşlenmeden önce 0.5s üfle
post_delay: 1.0                ; Lazer söndükten sonra 1.0s üfle

[exhaust_fan]
pin: PE5                       ; FAN1 MOSFET
default_speed: 1.0             ; %100 PWM
off_delay: 20                  ; İş bittikten sonra 20 saniye daha duman tahliye et

[red_pointer]
pin: PB10                      ; 3.3V Lojik Kırmızı Nokta Lazer
auto_frame: true               ; Çerçeveleme sırasında otomatik aç

# ------------------------------------------------------------------------------
# GÜVENLİK VE KORUMA SENSÖRLERİ
# ------------------------------------------------------------------------------
[safety]
lid_switch_pin: PG11           ; Kabin Kapağı Güvenlik Switchi
flame_sensor_pin: PC2          ; Alev / Yangın Dedektörü
max_diode_temp: 55.0           ; Celsius (Aşırı ısınma koruması)
estop_pin: PC0                 ; Acil Durdurma Butonu

# ------------------------------------------------------------------------------
# G-CODE MAKROLARI ([gcode_macro])
# ------------------------------------------------------------------------------
[gcode_macro START_CUT]
description: Kesim başlangıç sekansı (Hava üfleme ve duman tahliyesi açar)
gcode:
    M7                         ; Hava yardımını aç
    M106 S255                  ; Duman fanını tam hızda çalıştır
    G4 P500                    ; Basıncın oturması için 500ms bekle

[gcode_macro END_CUT]
description: Kesim bitiş sekansı (Lazeri kapatır, dumanı tahliye eder)
gcode:
    M5                         ; Lazer gücünü sıfırla
    M9                         ; Hava yardımını durdur
    G4 P3000                   ; 3 saniye duman tahliyesi bekle
    M107                       ; Emiş fanını kapat

[gcode_macro AIR_ON]
description: Manuel hava yardımını aç
gcode:
    M7

[gcode_macro AIR_OFF]
description: Manuel hava yardımını kapat
gcode:
    M9

[gcode_macro CLEAN_LENS]
description: Lazer merceğini temizlemek için kafayı ön ortaya getirir
gcode:
    G0 X200 Y50 F3000
