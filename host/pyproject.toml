[project]
name = "laserrunner"
version = "0.1.0"
description = "High-performance distributed CNC & Diode Laser OS with LightBurn-style Studio"
authors = [{ name = "LaserRunner Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.24.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
    "pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
